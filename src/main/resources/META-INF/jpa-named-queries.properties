Veicolo.filter = select v from Veicolo v where \
(:marca is null or lower(v.marca) like lower(concat('%', cast(:marca as string), '%'))) and \
(:alimentazione is null or v.alimentazione = :alimentazione) and \
(:categoria is null or lower(v.categoria.descrizione) like lower(concat('%', cast(:categoria as string), '%'))) and \
(:annoMin is null or v.anno >= :annoMin) and \
(:annoMax is null or v.anno <= :annoMax) and \
(:tipo is null or v.tipoVeicolo = :tipo) and \
(:targa is null or v.targa = :targa) and \
(:porte is null or (type(v) = Macchina and treat(v as Macchina).porte = :porte)) and \
(:marce is null or (type(v) = Bici and treat(v as Bici).marce = :marce)) and \
(:tipoForcella is null or (type(v) = Moto and lower(treat(v as Moto).tipoForcella) like lower(concat('%', cast(:tipoForcella as string), '%'))))